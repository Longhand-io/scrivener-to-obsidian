# The site FAQ is generated from docs/FAQ.md. This fails when the published page has drifted.
name: FAQ drift
on:
  pull_request:
    paths: [docs/FAQ.md, hack/faqgen/**]
  push:
    branches: [main]
    paths: [docs/FAQ.md, hack/faqgen/**]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Longhand-io/longhand-site
          path: site
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod
      - name: check
        run: go run ./hack/faqgen -md docs/FAQ.md -html site/faq.html -check
