# Release. A v* tag runs the gate, builds the archives with hack/build-release.sh, and publishes
# a GitHub release whose notes are that version's CHANGELOG section. The only job with a write
# token is the one that creates the release; actions pinned by SHA.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod
      - name: gate
        run: hack/ci.sh
  release:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod
      - name: release notes from CHANGELOG.md
        run: hack/release-notes.sh "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/notes.md"
      - name: build archives and checksums
        run: hack/build-release.sh "${GITHUB_REF_NAME}"
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            dist/*.tar.gz dist/*.zip dist/*_checksums.txt
